<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Mapa ilustrado: Córrego do Machado, em Jaguaruana, Ceará</title>
  <desc id="d">Ilustração do litoral do Ceará e do Rio Grande do Norte, com o Alto do Peru, em Córrego do Machado, Jaguaruana, marcado entre Fortaleza e Mossoró.</desc>
  <defs>
    <pattern id="ondas" width="36" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 12 Q9 5 18 12 T36 12" fill="none" stroke="#FFFFFF" stroke-opacity=".35" stroke-width="2"/>
    </pattern>
  </defs>

  <!-- terra -->
  <rect width="800" height="520" fill="#FFF3D1"/>
  <!-- oceano -->
  <path d="M0 0 H800 V520 H776 L760 440 L755 361 L752 328 L721 294 L650 290 L585 283 L525 266 L495 237 L454 215 L400 170 L358 124 L300 92 L227 57 L170 38 L119 23 L60 30 L0 34 Z" fill="#7FCFD1"/>
  <path d="M0 0 H800 V520 H776 L760 440 L755 361 L752 328 L721 294 L650 290 L585 283 L525 266 L495 237 L454 215 L400 170 L358 124 L300 92 L227 57 L170 38 L119 23 L60 30 L0 34 Z" fill="url(#ondas)"/>
  <!-- linha da costa -->
  <path d="M0 34 L60 30 L119 23 L170 38 L227 57 L300 92 L358 124 L400 170 L454 215 L495 237 L525 266 L585 283 L650 290 L721 294 L752 328 L755 361 L760 440 L776 520" fill="none" stroke="#00979C" stroke-width="3" stroke-linejoin="round"/>

  <!-- divisa CE / RN -->
  <path d="M507 252 L470 300 L430 362 L395 420 L358 475 L345 520" fill="none" stroke="#5E4A6B" stroke-width="2" stroke-dasharray="7 6" opacity=".7"/>

  <!-- rótulos de estados e mar -->
  <g font-family="Figtree, 'Segoe UI', Arial, sans-serif" fill="#5E4A6B" letter-spacing="4" font-weight="700" font-size="17" opacity=".75">
    <text x="190" y="330">CEARÁ</text>
    <text x="540" y="410">RIO GRANDE</text>
    <text x="560" y="432">DO NORTE</text>
  </g>
  <text x="560" y="110" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="26" fill="#FFFFFF">Oceano Atlântico</text>

  <!-- cidades de referência -->
  <g font-family="Figtree, 'Segoe UI', Arial, sans-serif" font-size="16" fill="#2B1438">
    <circle cx="137" cy="123" r="5" fill="#2B1438"/><text x="147" y="128">Sobral</text>
    <circle cx="356" cy="128" r="6" fill="#2B1438"/><text x="300" y="158" font-weight="700">Fortaleza</text>
    <circle cx="497" cy="293" r="5" fill="#2B1438"/><text x="507" y="310">Mossoró</text>
    <circle cx="751" cy="361" r="5" fill="#2B1438"/><text x="690" y="366">Natal</text>
  </g>

  <!-- Alto do Peru: a roda como marcador -->
  <g transform="translate(436 256)">
    <circle r="30" fill="none" stroke="#F7B500" stroke-width="7" stroke-dasharray="19 0" />
    <circle r="30" fill="none" stroke="#FF5A45" stroke-width="7" stroke-dasharray="37.7 150.8" transform="rotate(72)"/>
    <circle r="30" fill="none" stroke="#E0287A" stroke-width="7" stroke-dasharray="37.7 150.8" transform="rotate(144)"/>
    <circle r="30" fill="none" stroke="#00979C" stroke-width="7" stroke-dasharray="37.7 150.8" transform="rotate(216)"/>
    <circle r="30" fill="none" stroke="#4F1F78" stroke-width="7" stroke-dasharray="37.7 150.8" transform="rotate(288)"/>
    <circle r="9" fill="#4F1F78"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#4F1F78">
    <text x="232" y="238" font-size="24" font-style="italic">Alto do Peru</text>
    <text x="232" y="262" font-family="Figtree, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2B1438">Córrego do Machado</text>
    <text x="232" y="281" font-family="Figtree, 'Segoe UI', Arial, sans-serif" font-size="15" fill="#2B1438">Jaguaruana (CE)</text>
  </g>
  <path d="M388 250 L400 252" stroke="#4F1F78" stroke-width="2"/>

  <text x="20" y="505" font-family="Figtree, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#5E4A6B">Ilustração sem escala</text>
</svg>
